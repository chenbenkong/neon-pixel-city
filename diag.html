<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON//CITY 加载诊断</title>
<style>
  body { margin:0; padding:24px; background:#0b0616; color:#e8e4ff;
         font-family: ui-monospace, Consolas, "Courier New", monospace; font-size:14px; line-height:1.7; }
  h1 { font-size:18px; color:#29f0ff; margin:0 0 4px; }
  .sub { color:#9a92c7; font-size:12px; margin-bottom:18px; }
  .box { background:rgba(255,255,255,.04); border-left:3px solid #ff2bd6;
         padding:12px 16px; margin:10px 0; white-space:pre-wrap; word-break:break-all; }
  .ok { color:#4dffa8; } .bad { color:#ff5c7a; } .warn { color:#ffd166; } .dim { color:#9a92c7; }
</style>
</head>
<body>
<h1>NEON//CITY 加载诊断</h1>
<div class="sub">把这个页面完整截图发给我即可定位「卡在 0%」的原因</div>
<div id="out" class="box">正在检测…</div>

<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>

<script>
window.__diag = { errors: [] };
var out = document.getElementById('out');
function line(html) { out.insertAdjacentHTML('beforeend', html + '<br>'); }
function clearOut() { out.innerHTML = ''; }

addEventListener('error', function (e) {
  window.__diag.errors.push('[error] ' + (e.message || '') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno);
}, true);
addEventListener('unhandledrejection', function (e) {
  window.__diag.errors.push('[rejection] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});

// 1. 浏览器与基础能力
function basics() {
  clearOut();
  var ua = navigator.userAgent;
  var m = ua.match(/(Chrome|Chromium|Edg|Firefox|Safari)\/([\d.]+)/);
  var name = m ? m[1] + ' ' + m[2] : '未知';
  if (ua.indexOf('360') > -1 || ua.indexOf('QIHU') > -1) name += ' (疑似 360)';
  if (ua.indexOf('QQBrowser') > -1) name += ' (疑似 QQ 浏览器)';
  if (ua.indexOf('LBBROWSER') > -1) name += ' (疑似猎豹)';
  line('<span class="dim">浏览器</span>　　' + name);
  line('<span class="dim">页面协议</span>　' + location.protocol + '　<span class="dim">主机</span> ' + location.host);

  var im = (window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  line((im ? '<span class="ok">✔</span>' : '<span class="bad">✘</span>') +
       ' import maps 支持（three.js 依赖它，需要 Chrome/Edge 89+）');

  var c = document.createElement('canvas');
  var gl2 = !!c.getContext('webgl2');
  var gl1 = gl2 || !!c.getContext('webgl');
  line((gl2 ? '<span class="ok">✔</span>' : '<span class="bad">✘</span>') + ' WebGL2（3D 模式必需）');
  line((gl1 ? '<span class="ok">✔</span>' : '<span class="bad">✘</span>') + ' WebGL（至少要有）');
}

// 2. 逐个抓取关键资源，看状态码与 MIME
function probe(url, label) {
  return fetch(url, { cache: 'no-store' }).then(function (r) {
    var ct = (r.headers.get('content-type') || '(无)').split(';')[0].trim();
    var jsOk = /javascript|ecmascript/.test(ct);
    var good = r.ok && jsOk;
    return { url: url, label: label, status: r.status, ct: ct, good: good };
  }).catch(function (e) {
    return { url: url, label: label, status: '请求失败', ct: String(e.message || e), good: false };
  });
}

basics();
line('<br><span class="dim">—— 资源探测 ——</span>');

Promise.all([
  probe('./js/main.js', '入口模块 main.js'),
  probe('./js/city2d.js', '2D 主逻辑'),
  probe('./vendor/three/three.module.js', 'three.js 主包'),
  probe('./vendor/three/three.core.js', 'three.js 核心(1.5MB)'),
]).then(function (rs) {
  rs.forEach(function (r) {
    var tag = r.good ? '<span class="ok">✔</span>' : '<span class="bad">✘</span>';
    line(tag + ' ' + r.label + '　HTTP ' + r.status + '　类型 <span class="' +
         (r.good ? 'ok' : 'bad') + '">' + r.ct + '</span>');
  });
  var bad = rs.filter(function (r) { return !r.good; });
  if (bad.length) {
    line('<br><span class="bad">结论：有资源的 MIME 类型不是 JavaScript，浏览器会直接拒绝执行 ES module，' +
         '这就是进度停在 0% 且没有任何报错的原因。</span>');
    line('<span class="dim">常见于：公司/校园代理、杀毒软件（360、火绒）的 HTTPS 拦截、或某些加速器。</span>');
  }
  return checkModule();
}).then(report);

// 3. 真正 import 一次，验证 module 能否执行
function checkModule() {
  return new Promise(function (resolve) {
    var s = document.createElement('script');
    s.type = 'module';
    s.textContent = "import('./js/main.js').then(function(){window.__diag.moduleOK=true;})" +
                    ".catch(function(e){window.__diag.moduleErr=String(e && e.message || e);});";
    document.body.appendChild(s);
    setTimeout(resolve, 12000);
  });
}

function report() {
  var d = window.__diag;
  line('<br><span class="dim">—— 模块执行 ——</span>');
  if (d.moduleOK) {
    line('<span class="ok">✔ js/main.js 成功执行</span>　（说明加载链路没问题，卡 0% 需另查）');
  } else {
    line('<span class="bad">✘ js/main.js 未能执行</span>');
    if (d.moduleErr) line('<span class="bad">错误信息：' + d.moduleErr + '</span>');
  }
  line('<br><span class="dim">—— 捕获到的报错 ——</span>');
  if (!d.errors.length) line('<span class="dim">（无）</span>');
  else d.errors.forEach(function (e) { line('<span class="bad">' + e + '</span>'); });

  line('<br><span class="dim">—— 一键自检 ——</span>');
  line('也可以自己看：按 F12 → Console，找红色 "Failed to load module script"；' +
       '再切到 Network，看 js/main.js 的 Type 列是否为 script。');
}
</script>
</body>
</html>
